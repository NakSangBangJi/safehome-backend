<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1390" viewBox="0 0 1800 1390" role="img"><title>안심 서비스 · 서버 구조와 연동 범위</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#29485e"/></marker><marker id="future" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#666666"/></marker></defs><style>text{font-family:'Malgun Gothic',sans-serif;fill:#111111}.title{font-size:34px;font-weight:700;fill:#29485e}.sub{font-size:18px;fill:#555555}.head{font-size:24px;font-weight:700}.body{font-size:19px}.small{font-size:16px;fill:#555555}.tiny{font-size:14px;fill:#555555}.name{font-size:19px;font-weight:600}.tag{font-size:14px;fill:#fff;font-weight:bold}.line{fill:none;stroke:#29485e;stroke-width:2.4;marker-end:url(#arrow)}.dash{fill:none;stroke:#666666;stroke-width:2.4;stroke-dasharray:8 6;marker-end:url(#future)}</style><rect width="1800" height="1390" fill="#ffffff"/><text x="45" y="57" class="title" >안심 서비스 · 서버 구조와 연동 범위</text><text x="45" y="91" class="sub" >백엔드 v1.5.0 · 2026-11-22 · 실선: 현재 서버에서 모의 검증한 경로 / 점선: 실제 기기·모델·앱 연결 및 후속 구현</text><rect x="45" y="155" width="355" height="325" rx="15" fill="#f2f2f2" stroke="#999999" stroke-width="1.5" stroke-dasharray="8 5"/><text x="67" y="194" class="head" >실제 센서 · AI · 게이트웨이</text><text x="67" y="233" class="body" >압전 · ToF · 카메라 데이터</text><text x="67" y="263" class="body" >수집·추론은 HW / AI 파트 담당</text><text x="67" y="293" class="body" >위험·활동·패턴·하트비트 전송</text><text x="67" y="323" class="body" >AI → 서버 단계 매핑은 협의 대상</text><text x="67" y="353" class="body" >실기기·실모델 연결 시험 예정</text><text x="67" y="383" class="body" >MQTT 수신은 후속 구현</text><rect x="45" y="620" width="355" height="245" rx="15" fill="#f5f5f5" stroke="#999999" stroke-width="1.5" /><text x="67" y="659" class="head" >모의 송신 · 확인 화면</text><text x="67" y="698" class="body" >가상 센서·AI 이벤트로 검증</text><text x="67" y="728" class="body" >HTTP POST / JSON</text><text x="67" y="758" class="body" >고유 event_id · 발생 시각</text><text x="67" y="788" class="body" >가상 장치 명령 조회·ACK</text><text x="67" y="818" class="body" >/ · /admin-test · /docs</text><rect x="470" y="155" width="790" height="795" rx="15" fill="#fff" stroke="#29485e" stroke-width="1.5" /><path d="M485 156 H1245 Q1259 156 1259 170 V245 H471 V170 Q471 156 485 156 Z" fill="#edf2f6"/><text x="495" y="198" class="head" style="fill:#29485e">FastAPI / Uvicorn · 단일 서버 프로세스</text><text x="495" y="232" class="body" >입력 검증 · 트랜잭션 · 역할별 권한 · 중복 방지</text><rect x="495" y="260" width="740" height="130" rx="15" fill="#edf2f6" stroke="#29485e" stroke-width="1.5" /><text x="517" y="299" class="head" style="fill:#29485e">인증 · REST 조회 / 일정 관리</text><text x="517" y="338" class="body" >보호자: 연결된 대상 / 어르신: 본인 / 관리자: 전체 조회</text><text x="517" y="368" class="body" >실제 비밀번호 해시 + DB 세션 / 개발용 Mock 인증 병행</text><rect x="495" y="415" width="740" height="160" rx="15" fill="#edf2f6" stroke="#29485e" stroke-width="1.5" /><text x="517" y="454" class="head" style="fill:#29485e">HTTP 이벤트 처리 · 복약 엔진</text><text x="517" y="493" class="body" >위험·활동·패턴·하트비트 수신 → 검증·저장·최신 상태 반영</text><text x="517" y="523" class="body" >1차 의심 / 카메라 최종 결과 연결 → 같은 사고 갱신</text><text x="517" y="553" class="body" >복약 시간 + 활동 → 안내 명령 생성 → ACK 처리</text><rect x="495" y="600" width="740" height="160" rx="15" fill="#edf2f6" stroke="#29485e" stroke-width="1.5" /><text x="517" y="639" class="head" style="fill:#29485e">실시간 알림 · 누락 이력 복구</text><text x="517" y="678" class="body" >/ws/live: 대상별 구독 · /ws/admin/live: 관리자 전체 구독</text><text x="517" y="708" class="body" >event_feed 커서 / 관리자 sync로 재연결 시 이력 복구</text><text x="517" y="738" class="body" >notifications: 모의 알림 기록 (실제 휴대폰 발송은 미구현)</text><text x="495" y="804" class="small" >카메라 결과를 받는 서버 처리이며 영상 추론은 수행하지 않습니다.</text><text x="495" y="837" class="small" >장치 연결 상태와 위험 상태를 분리합니다. 미판단 상태는 따로 표시합니다.</text><text x="495" y="870" class="small" >하트비트 90초 초과 시 OFFLINE · 최신 사건 기준으로 현재 상태 갱신</text><text x="495" y="903" class="small" >로그인 화면은 기능 확인용으로 준비되어 있고 프론트 앱 적용은 후속입니다.</text><rect x="1330" y="155" width="425" height="290" rx="15" fill="#f2f2f2" stroke="#999999" stroke-width="1.5" stroke-dasharray="8 5"/><text x="1352" y="194" class="head" >프론트 앱 · 관리자 웹</text><text x="1352" y="233" class="body" >보호자 앱: 상태·사고·패턴·복약</text><text x="1352" y="263" class="body" >어르신 앱: 본인 상태·복약 관리</text><text x="1352" y="293" class="body" >관리자 웹: 가구·사건·장치 조회</text><text x="1352" y="323" class="body" >REST 요청 / WebSocket 구독</text><text x="1352" y="353" class="body" >실제 화면 구현·연동 시험은 후속</text><rect x="1330" y="535" width="425" height="170" rx="15" fill="#f2f2f2" stroke="#999999" stroke-width="1.5" stroke-dasharray="8 5"/><text x="1352" y="574" class="head" >휴대폰 푸시 · 후속 구현</text><text x="1352" y="613" class="body" >FCM / Expo 실제 발송 미연동</text><text x="1352" y="643" class="body" >현재: MOCK_QUEUED / NO_TOKEN</text><text x="1352" y="673" class="body" >기록 생성은 발송 성공이 아님</text><rect x="1330" y="795" width="425" height="170" rx="15" fill="#f2f2f2" stroke="#999999" stroke-width="1.5" stroke-dasharray="8 5"/><text x="1352" y="834" class="head" >게이트웨이 · 스피커 연결</text><text x="1352" y="873" class="body" >명령 조회 → 물리 재생 → ACK</text><text x="1352" y="903" class="body" >서버 명령·ACK는 모의 구현 완료</text><text x="1352" y="933" class="body" >물리 장치 연결·출력 시험은 후속</text><rect x="470" y="1020" width="790" height="180" rx="15" fill="#edf2f6" stroke="#29485e" stroke-width="1.5" /><text x="492" y="1059" class="head" style="fill:#29485e">SQLite · 영구 저장</text><text x="492" y="1098" class="body" >21개 테이블 · 141개 열 · schema.sql 기준</text><text x="492" y="1128" class="body" >계정·세션 / 대상·장치 / 이벤트·사고 / 복약·명령 / 알림·동기화</text><text x="492" y="1158" class="body" >sqlite3 · WAL · 외래키 활성화 · 명령·이벤트의 중복 제어</text><path class="dash" d="M400 310 H435 V488 H495"/><text x="405" y="365" class="tiny" >HTTP 예정</text><path class="line" d="M400 730 H445 V525 H495"/><text x="400" y="700" class="tiny" >모의 HTTP</text><path class="dash" d="M1260 300 H1330"/><text x="1267" y="282" class="tiny" >REST / WS</text><path class="dash" d="M1260 650 H1330"/><text x="1267" y="630" class="tiny" >후속 발송</text><path class="dash" d="M1260 856 H1330"/><text x="1264" y="834" class="tiny" >명령 / ACK</text><path class="line" d="M865 950 V1020"/><text x="884" y="990" class="tiny" >트랜잭션 기록</text><rect x="45" y="1250" width="1710" height="90" rx="15" fill="#fff" stroke="#999999" stroke-width="1.5" /><text x="68" y="1286" class="body" >B01~B05 발표 범위: 서버 구조 · 규격 · DB 설계 · 실행 환경 · Swagger / Mock 검증</text><text x="68" y="1318" class="small" >미리 구현한 인증·관리자 실시간·카메라 결과 처리는 확장 근거로 제시하며, 실제 HW·AI·프론트 통합 완료와 구분합니다.</text></svg>